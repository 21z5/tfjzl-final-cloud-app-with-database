<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Online Courses{% endblock %}</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; margin: 0; background: #f5f5f5; }
        header { background: #1e293b; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .nav-links a { color: #fff; text-decoration: none; margin-right: 16px; }
        .user-info { color: #fff; }
        main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .btn { display: inline-block; background: #2563eb; color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #dcfce7; color: #166534; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-links">
            <a href="{% url 'course_list' %}">Online Courses</a>
            {% if user.is_authenticated %}
                <a href="{% url 'my_courses' %}">My Courses</a>
            {% endif %}
        </div>
        <div>
            {% if user.is_authenticated %}
                <span class="user-info">Welcome, {{ user.username }}</span>
            {% else %}
                <a href="/admin/login/" style="color: #fff; text-decoration: none;">Log In</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
